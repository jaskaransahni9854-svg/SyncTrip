# Settings for Firebase App Hosting
kind: AppHostingYaml
schemaVersion: v1
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: synctrip-app.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: synctrip-app
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: synctrip-app.appspot.com
